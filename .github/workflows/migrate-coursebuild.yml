name: Migrate CourseBuild RC1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-coursebuild.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone CourseBuild repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Independent User RC1 source
        run: |
          git clone --depth 1 --branch product/coursebuild-independent-user-rc1 \
            https://github.com/brandinealnku/inf125-ai-course-studio.git /tmp/coursebuild-source

      - name: Copy standalone product to repository root
        run: |
          rsync -av \
            --exclude='README.md' \
            --exclude='*.gs' \
            /tmp/coursebuild-source/coursebuild/ ./

          # Keep proprietary/server-side pilot implementation out of this temporary public repo.
          rm -f apps-script-backend.gs managed-storage-backend.gs

          cat > .gitignore <<'EOF'
          .DS_Store
          .env
          .env.*
          *.local
          pilot-exports/
          private/
          secrets/
          EOF

          cat > _headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            X-Robots-Tag: noindex, nofollow, noarchive
          EOF

          cat > robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

      - name: Verify no obvious secrets were migrated
        run: |
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,}|https://script\.google\.com/macros/s/[A-Za-z0-9_-]{20,}' \
            --exclude-dir=.git --exclude='migrate-coursebuild.yml' .; then
            echo 'Potential secret or deployed endpoint detected; refusing migration.'
            exit 1
          fi

      - name: Verify root application
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f independent-user.js
          test -f independent-user.css
          node --check app.js
          node --check independent-user.js
          node --check projects.js
          node --check versions.js
          node --check version-publish.js
          node --check version-reconcile.js
          node --check reconciliation-resolution.js

      - name: Commit standalone RC1 migration
        run: |
          git config user.name "CourseBuild Migration"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Migrate CourseBuild Independent User RC1 to standalone root"
          git push origin main
