name: Course tooling checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application boundaries
        run: |
          test -f apps/coursebuild-classic/index.html
          test -f apps/coursebuild-classic/app.js
          test -f apps/coursebuild-classic/functions/api/coursebuild.js
          test -f apps/coursebuild-classic/tests/trust-state-integrity.test.js
          test -f apps/course-ops/index.html
          test -f apps/course-ops/styles.css
          test -f apps/course-ops/app.js
          test -f apps/.assetsignore
          test -f functions/api/course-ops.js
          test -f functions/api/coursebuild.js
          test -f worker.js
          test -f wrangler.jsonc
          test -f package.json
          test -f scripts/deploy-cloudflare.mjs
          test -f docs/COURSEBUILD_CLASSIC.md
          test -f docs/COURSE_OPS_PRODUCT_CONTEXT.md
          test -f docs/PRODUCT_DECISIONS.md
          test -f packages/README.md
      - name: Verify Cloudflare Worker deployment boundary
        run: |
          node --input-type=module --check < worker.js
          node --check scripts/deploy-cloudflare.mjs
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.assets.directory!== 'apps') process.exit(1); if(c.keep_vars!==true) process.exit(1); if(c.vars?.CANVAS_BASE_URL!=='https://nku.instructure.com') process.exit(1); if(!Array.isArray(c.secrets?.required)||!c.secrets.required.includes('CANVAS_ACCESS_TOKEN')) process.exit(1); if(!Array.isArray(c.assets.run_worker_first)||!c.assets.run_worker_first.includes('/api/*')||!c.assets.run_worker_first.includes('/apps/*')||!c.assets.run_worker_first.includes('/')) process.exit(1);"
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(p.scripts?.['deploy:cloudflare']!=='node scripts/deploy-cloudflare.mjs') process.exit(1);"
          grep -Fq '"main": "worker.js"' wrangler.jsonc
          grep -Fq '"keep_vars": true' wrangler.jsonc
          grep -Fq '"CANVAS_BASE_URL": "https://nku.instructure.com"' wrangler.jsonc
          grep -Fq '"required": ["CANVAS_ACCESS_TOKEN"]' wrangler.jsonc
          grep -Fq '"binding": "ASSETS"' wrangler.jsonc
          ! grep -Fq '"directory": "."' wrangler.jsonc
          grep -Fq 'process.env.CANVAS_ACCESS_TOKEN' scripts/deploy-cloudflare.mjs
          grep -Fq "['wrangler', 'deploy', '--secrets-file', secretsPath]" scripts/deploy-cloudflare.mjs
          grep -Fq 'mode: 0o600' scripts/deploy-cloudflare.mjs
          grep -Fq 'rmSync(tempDir, { recursive: true, force: true })' scripts/deploy-cloudflare.mjs
          ! env -u CANVAS_ACCESS_TOKEN node scripts/deploy-cloudflare.mjs
          grep -Fq "url.pathname === '/api/course-ops'" worker.js
          grep -Fq "url.pathname === '/api/coursebuild'" worker.js
          grep -Fq "url.pathname === '/'" worker.js
          grep -Fq "url.pathname.startsWith('/apps/')" worker.js
          grep -Fq "replace(/^\\/apps/, '')" worker.js
          grep -Fq 'env.ASSETS.fetch(appAssetRequest(request, url))' worker.js
          grep -Fq 'coursebuild-classic/functions/' apps/.assetsignore
          grep -Fq 'coursebuild-classic/tests/' apps/.assetsignore
      - name: Check Course Ops inspector syntax and read-only boundary
        run: |
          node --check apps/course-ops/app.js
          node --input-type=module --check < functions/api/course-ops.js
          grep -Fq 'Canvas Inspector' apps/course-ops/index.html
          grep -Fq 'Read-only build' apps/course-ops/index.html
          grep -Fq 'It cannot change Canvas content yet.' apps/course-ops/index.html
          grep -Fq "const API='/api/course-ops'" apps/course-ops/app.js
          grep -Fq 'canvasRead:true' apps/course-ops/app.js
          grep -Fq 'canvasWrite:false' apps/course-ops/app.js
          grep -Fq 'bulkEdit:false' apps/course-ops/app.js
          grep -Fq "action==='verifyCourse'" functions/api/course-ops.js
          grep -Fq "action==='inspectCourse'" functions/api/course-ops.js
          grep -Fq '/api/v1/users/self/profile' functions/api/course-ops.js
          grep -Fq 'CANVAS_TOKEN_REJECTED' functions/api/course-ops.js
          grep -Fq 'CANVAS_ACCESS_DENIED' functions/api/course-ops.js
          grep -Fq 'CANVAS_RESOURCE_NOT_FOUND' functions/api/course-ops.js
          grep -Fq 'Canvas accepted the request but denied access.' functions/api/course-ops.js
          grep -Fq 'This Canvas host is not approved for Course Ops.' functions/api/course-ops.js
          grep -Fq "version:'canvas-inspector-2'" functions/api/course-ops.js
          grep -Fq 'readOnly:true' functions/api/course-ops.js
          ! grep -Eq "method:['\"](PUT|PATCH|DELETE)['\"]" functions/api/course-ops.js
      - name: Verify inspector object coverage
        run: |
          for type in Module Page Assignment Discussion Quiz File Announcement; do
            grep -Fq "$type" apps/course-ops/index.html apps/course-ops/app.js functions/api/course-ops.js || { echo "Missing $type inspector coverage"; exit 1; }
          done
          grep -Fq '/modules?per_page=100' functions/api/course-ops.js
          grep -Fq '/pages?per_page=100' functions/api/course-ops.js
          grep -Fq '/assignments?per_page=100' functions/api/course-ops.js
          grep -Fq '/discussion_topics?per_page=100' functions/api/course-ops.js
          grep -Fq '/quizzes?per_page=100' functions/api/course-ops.js
          grep -Fq '/files?per_page=100' functions/api/course-ops.js
          grep -Fq '/announcements?' functions/api/course-ops.js
      - name: Verify Classic remains runnable source
        run: |
          node --check apps/coursebuild-classic/app.js
          node --check apps/coursebuild-classic/trust-state-model.js
          node --check apps/coursebuild-classic/trust-state-integrity-rc6-4.js
          node --check apps/coursebuild-classic/coursebuild-service-client.js
          node --check apps/coursebuild-classic/source-intelligence.js
          node --check apps/coursebuild-classic/course-readiness.js
          node --check apps/coursebuild-classic/tests/trust-state-integrity.test.js
          node apps/coursebuild-classic/tests/trust-state-integrity.test.js
          node --input-type=module --check < apps/coursebuild-classic/functions/api/coursebuild.js
      - name: Confirm public repository secret boundary
        run: |
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,}|https://script\.google\.com/macros/s/[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
