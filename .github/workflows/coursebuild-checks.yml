name: Course tooling checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application boundaries
        run: |
          test -f apps/coursebuild-classic/index.html
          test -f apps/coursebuild-classic/app.js
          test -f apps/coursebuild-classic/functions/api/coursebuild.js
          test -f apps/coursebuild-classic/tests/trust-state-integrity.test.js
          test -f apps/course-ops/index.html
          test -f apps/course-ops/styles.css
          test -f apps/course-ops/app.js
          test -f docs/COURSEBUILD_CLASSIC.md
          test -f docs/COURSE_OPS_PRODUCT_CONTEXT.md
          test -f docs/PRODUCT_DECISIONS.md
          test -f packages/README.md
      - name: Check Course Ops shell syntax and truth boundary
        run: |
          node --check apps/course-ops/app.js
          grep -Fq 'Inspect' apps/course-ops/index.html
          grep -Fq 'Select' apps/course-ops/index.html
          grep -Fq 'Change' apps/course-ops/index.html
          grep -Fq 'Review' apps/course-ops/index.html
          grep -Fq 'Apply' apps/course-ops/index.html
          grep -Fq 'Verify' apps/course-ops/index.html
          grep -Fq 'No Canvas mutation' apps/course-ops/index.html
          grep -Fq 'canvasWrite:false' apps/course-ops/app.js
          grep -Fq 'bulkEdit:false' apps/course-ops/app.js
      - name: Verify Classic remains runnable source
        run: |
          node --check apps/coursebuild-classic/app.js
          node --check apps/coursebuild-classic/trust-state-model.js
          node --check apps/coursebuild-classic/trust-state-integrity-rc6-4.js
          node --check apps/coursebuild-classic/coursebuild-service-client.js
          node --check apps/coursebuild-classic/source-intelligence.js
          node --check apps/coursebuild-classic/course-readiness.js
          node --check apps/coursebuild-classic/tests/trust-state-integrity.test.js
          node apps/coursebuild-classic/tests/trust-state-integrity.test.js
          node --input-type=module --check < apps/coursebuild-classic/functions/api/coursebuild.js
      - name: Confirm public repository secret boundary
        run: |
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,}|https://script\.google\.com/macros/s/[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
