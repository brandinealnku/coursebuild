name: CourseBuild checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required root assets
        run: |
          for file in index.html styles.css app.js projects.js projects.css versions.js versions.css version-publish.js version-reconcile.js reconciliation-resolution.js reconciliation-resolution.css sample-course.js responsive.css product-experience-rc2.css product-experience-rc3.css product-experience-rc3.js rc3-mobile-hardening.css rc3-mobile-hardening.js cdo-experience-rc4.css cdo-experience-rc4.js rc4-visible-activation.css rc4-visible-activation.js experience-debt-rc5.css experience-debt-rc5.js unified-modern-rc6.css unified-modern-rc6.js rc6-2-contrast-nav-polish.css rc6-3-legacy-contrast-cleanup.css interaction-smoke-rc6.js trust-state-model.js trust-state-integrity-rc6-4.js coursebuild-academy.js coursebuild-academy.css RC6_4_BACKEND_CONTRACT.md tests/trust-state-integrity.test.js _headers robots.txt; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check projects.js
          node --check managed-storage.js
          node --check versions.js
          node --check version-publish.js
          node --check version-reconcile.js
          node --check reconciliation-resolution.js
          node --check telemetry.js
          node --check pilot.js
          node --check cohort.js
          node --check product-experience-rc3.js
          node --check rc3-mobile-hardening.js
          node --check cdo-experience-rc4.js
          node --check rc4-visible-activation.js
          node --check experience-debt-rc5.js
          node --check unified-modern-rc6.js
          node --check interaction-smoke-rc6.js
          node --check trust-state-model.js
          node --check trust-state-integrity-rc6-4.js
          node --check coursebuild-academy.js
          node --check tests/trust-state-integrity.test.js
      - name: Run RC6.4 trust-state model tests
        run: node tests/trust-state-integrity.test.js
      - name: Verify RC6.4 runtime order and trust operations
        run: |
          grep -Fq 'trust-state-model.js?v=rc6.4' index.html
          grep -Fq 'trust-state-integrity-rc6-4.js?v=rc6.4' index.html
          grep -Fq "api('verifyCanvasConnection'" trust-state-integrity-rc6-4.js
          grep -Fq "api('verifyPublishedItem'" trust-state-integrity-rc6-4.js
          grep -Fq "state='Sent / unverified'" trust-state-integrity-rc6-4.js
          grep -Fq "state:'Generation failed'" trust-state-integrity-rc6-4.js
          ! grep -Fq 'Pilot sample' trust-state-integrity-rc6-4.js
          ! grep -Fq 'localArchitecture' trust-state-integrity-rc6-4.js
      - name: Verify CourseBuild Academy boundary and entry point
        run: |
          grep -Fq 'coursebuild-academy.css?v=academy1' index.html
          grep -Fq 'coursebuild-academy.js?v=academy1' index.html
          grep -Fq "ACADEMY_ID='coursebuild-academy-v1'" coursebuild-academy.js
          grep -Fq 'do not publish Academy content to a live student course' coursebuild-academy.js
          grep -Fq 'resettable:true' coursebuild-academy.js
      - name: Guard against mutation feedback loops
        run: |
          ! grep -n "MutationObserver(()=>normalizeLanguage())" unified-modern-rc6.js
      - name: Confirm public-repo backend boundary
        run: |
          test ! -f apps-script-backend.gs
          test ! -f managed-storage-backend.gs
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,}|https://script\.google\.com/macros/s/[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
